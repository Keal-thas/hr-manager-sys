server:
  port: 18080

spring:
  datasource:
    url: jdbc:h2:mem:hr_e2e;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  h2:
    console:
      enabled: false

logging:
  level:
    com.hrmanager: warn

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
