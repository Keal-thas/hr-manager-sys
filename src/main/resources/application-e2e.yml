server:
  port: 18080

spring:
  datasource:
    url: "jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:hr_e2e}?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true&sessionVariables=sql_mode='STRICT_TRANS_TABLES,NO_ENGINE_SUBSTITUTION',time_zone='%2B08:00'&connectionTimeZone=Asia/Shanghai&forceConnectionTimeZoneToSession=true"
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    druid:
      exception-sorter-class-name: com.hrmanager.config.LenientMySqlExceptionSorter
  flyway:
    enabled: true
    locations: classpath:db/migration/mysql
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true

logging:
  level:
    com.hrmanager: warn

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
