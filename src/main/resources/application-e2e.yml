server:
  port: 18080

spring:
  datasource:
    url: jdbc:h2:mem:hr_e2e;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  flyway:
    enabled: true
    locations: classpath:db/migration/h2
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true
  h2:
    console:
      enabled: false

logging:
  level:
    com.hrmanager: warn

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
