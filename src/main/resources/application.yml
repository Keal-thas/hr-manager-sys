server:
  port: 8080

spring:
  application:
    name: hr-manager-sys
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    url: jdbc:h2:file:./data/hr;MODE=MySQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
  flyway:
    enabled: true
    locations: classpath:db/migration/h2
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true
  h2:
    console:
      enabled: true
      path: /h2-console
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  jackson:
    time-zone: Asia/Shanghai

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
  metrics:
    tags:
      application: hr-manager-sys
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5,0.95,0.99
  info:
    env:
      enabled: true

info:
  app:
    name: hr-manager-sys
    description: HR management system
    version: 0.0.1

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

logging:
  level:
    com.hrmanager: info

app:
  wecom:
    enabled: ${WECOM_ENABLED:false}
    corp-id: ${WECOM_CORP_ID:}
    agent-id: ${WECOM_AGENT_ID:}
    secret: ${WECOM_SECRET:}
    base-url: https://qyapi.weixin.qq.com
    connect-timeout-ms: 3000
    read-timeout-ms: 5000
    use-employee-no-fallback: true
    max-content-length: 2000
