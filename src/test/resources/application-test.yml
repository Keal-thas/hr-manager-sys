spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    druid:
      exception-sorter-class-name: com.hrmanager.config.LenientMySqlExceptionSorter
  flyway:
    enabled: true
    locations: classpath:db/migration/mysql
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true

management:
  metrics:
    export:
      prometheus:
        enabled: true

logging:
  level:
    com.hrmanager: warn
