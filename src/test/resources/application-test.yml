spring:
  datasource:
    url: jdbc:h2:mem:hr_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  h2:
    console:
      enabled: false

management:
  metrics:
    export:
      prometheus:
        enabled: true

logging:
  level:
    com.hrmanager: warn
