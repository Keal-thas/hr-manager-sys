groups:
  - name: hr-manager-technical
    rules:
      - alert: AppDown
        expr: up{job="hr-manager-technical"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: hr-manager-sys is down
          description: Prometheus cannot scrape /actuator/prometheus.

      - alert: HighHttp5xxRate
        expr: |
          sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m]))
          /
          clamp_min(sum(rate(http_server_requests_seconds_count[5m])), 0.001)
          > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: HTTP 5xx rate above 5%
          description: "5xx ratio is {{ $value | humanizePercentage }} over the last 5 minutes."

      - alert: HighP95Latency
        expr: histogram_quantile(0.95, sum by (le) (rate(http_server_requests_seconds_bucket[5m]))) > 1.5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: P95 latency above 1.5s
          description: "P95 latency is {{ $value }}s over the last 5 minutes."

      - alert: HighProcessCpu
        expr: process_cpu_usage > 0.85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Process CPU above 85%
          description: "Process CPU is {{ $value | humanizePercentage }}."

      - alert: DruidPoolSaturation
        expr: |
          druid_connections_pending > 5
          or
          (druid_connections_active / clamp_min(druid_connections_max, 1)) > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Druid connection pool saturated
          description: "Pending {{ $value }} or active/max ratio above 90%."
