name: hr-sandbox

services:
  mysql:
    image: mysql:8.0
    container_name: hr-sandbox-mysql
    restart: unless-stopped
    command: ["--character-set-server=utf8mb4", "--performance_schema=off"]
    environment:
      MYSQL_ROOT_PASSWORD: root
      TZ: Asia/Shanghai
    mem_limit: 768m
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -proot --silent"]
      interval: 10s
      timeout: 5s
      retries: 12

  sandbox:
    depends_on:
      mysql:
        condition: service_healthy
    build: .
    image: hr-sandbox:local
    container_name: hr-sandbox
    restart: unless-stopped
    ports:
      - "${BIND_HOST:-0.0.0.0}:8081:8081"
      - "${BIND_HOST:-0.0.0.0}:4097:4097"
    environment:
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GH_TOKEN: ${GITHUB_TOKEN:-}
      GIT_USER_NAME: ${GIT_USER_NAME:-}
      GIT_USER_EMAIL: ${GIT_USER_EMAIL:-}
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD:?set OPENCODE_SERVER_PASSWORD in .env}
      OPENCODE_DISABLE_AUTOUPDATE: "1"
      APP_PORT: "8081"
      OC_PORT: "4097"
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USERNAME: root
      DB_PASSWORD: root
      TEST_DB_HOST: mysql
      TEST_DB_PORT: "3306"
      TEST_DB_USER: root
      TEST_DB_PASSWORD: root
      REBUILD: ${REBUILD:-0}
      REFRESH: ${REFRESH:-0}
      TZ: Asia/Shanghai
    volumes:
      - workspace:/workspace
      - m2:/root/.m2
      - npm-cache:/root/.npm
      - opencode-data:/root/.local/share/opencode
      - opencode-config:/root/.config/opencode
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8081/api/health >/dev/null && curl -fsS -u \"opencode:$$OPENCODE_SERVER_PASSWORD\" http://127.0.0.1:4097/ >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 600s

volumes:
  mysql-data:
  workspace:
  m2:
  npm-cache:
  opencode-data:
  opencode-config:
