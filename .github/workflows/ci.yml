name: CI

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (JDK 8)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: hr_manager
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
      - name: Test
        run: mvn -B -ntp test
        env:
          TEST_DB_HOST: 127.0.0.1
          TEST_DB_PORT: 3306
          TEST_DB_USER: root
          TEST_DB_PASSWORD: root
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: target/surefire-reports
          retention-days: 7
      - name: Coverage summary
        if: always()
        run: python3 scripts/coverage-summary.py >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: target/site/jacoco
          retention-days: 30

  quality:
    name: Code quality (report only)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
      - name: Checkstyle, PMD, CPD, SpotBugs
        continue-on-error: true
        run: mvn -B -ntp -Pquality compile checkstyle:checkstyle pmd:pmd pmd:cpd spotbugs:spotbugs
      - name: Quality summary
        if: always()
        run: python3 scripts/quality-summary.py >> "$GITHUB_STEP_SUMMARY"
      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quality-report
          path: |
            target/checkstyle-result.xml
            target/pmd.xml
            target/cpd.xml
            target/spotbugsXml.xml
          if-no-files-found: ignore
          retention-days: 30

  frontend:
    name: Frontend (Node 20)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci
      - name: Test
        working-directory: web
        run: npm test
      - name: Build
        working-directory: web
        run: npm run build
      - name: Verify generated assets are not tracked
        run: |
          tracked="$(git ls-files -- src/main/resources/static)"
          if [ -n "$tracked" ]; then
            echo "src/main/resources/static must not be tracked:"
            echo "$tracked"
            exit 1
          fi
      - name: Upload static assets
        uses: actions/upload-artifact@v7
        with:
          name: frontend-static
          path: src/main/resources/static
          if-no-files-found: error
          retention-days: 7

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [frontend]
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: hr_manager
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install frontend dependencies
        working-directory: web
        run: npm ci
      - name: Install Playwright Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Run E2E
        working-directory: web
        run: npm run e2e
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: hr_e2e
          DB_USERNAME: root
          DB_PASSWORD: root
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7

  package:
    name: Package jar
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
      - name: Download static assets
        uses: actions/download-artifact@v8
        with:
          name: frontend-static
          path: src/main/resources/static
      - name: Package
        run: mvn -B -ntp -DskipTests package
      - name: Upload application jar
        uses: actions/upload-artifact@v7
        with:
          name: hr-manager-sys-jar
          path: target/hr-manager-sys-*.jar
          if-no-files-found: error
          retention-days: 7
